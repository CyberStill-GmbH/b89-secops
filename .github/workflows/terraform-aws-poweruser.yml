name: Terraform AWS PowerUser

# Manual plan/apply for infra/aws-poweruser in account 061098277310.
# Required repository variable: B89_AWS_POWERUSER_TERRAFORM_ROLE_ARN.
# The role and GitHub OIDC provider are provisioned separately by an AWS administrator.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform operation
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: b89-secops-aws-poweruser-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1

jobs:
  terraform:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: infra/aws-poweruser
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require main branch and PowerUser role variable
        shell: bash
        env:
          AWS_POWERUSER_TERRAFORM_ROLE_ARN: ${{ vars.B89_AWS_POWERUSER_TERRAFORM_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo '::error::Terraform AWS PowerUser can run only from main.'
            exit 1
          fi
          if [[ ! "$AWS_POWERUSER_TERRAFORM_ROLE_ARN" =~ ^arn:aws:iam::061098277310:role/.+ ]]; then
            echo '::error::Set B89_AWS_POWERUSER_TERRAFORM_ROLE_ARN to a role ARN in account 061098277310.'
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.B89_AWS_POWERUSER_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: b89-poweruser-terraform-${{ github.run_id }}
          allowed-account-ids: '061098277310'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: |
          set -euo pipefail
          terraform plan \
            -input=false \
            -refresh=true \
            -lock=true \
            -lock-timeout=5m \
            -no-color \
            -var-file=environments/dev.tfvars \
            -out=poweruser.tfplan
          terraform show -no-color poweruser.tfplan > plan.txt
          {
            echo '### Terraform AWS PowerUser plan'
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply saved plan
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve -no-color poweruser.tfplan
