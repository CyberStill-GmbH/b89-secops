# B89 SOC · bitácora JSON del edge nginx para Wazuh (docs/18-visibilidad-de-red-y-capacidades-wazuh.md).
# Se monta en el contenedor edge como /etc/nginx/conf.d/b89-logging.conf (contexto http: aplica a todos
# los server{} del edge sin tocar edge.conf). Escribe en /var/log/b89-edge/, que es el subpath
# b89-collectors/edge del volumen de logs del manager: Wazuh lo lee como <localfile log_format="json">
# (infra/wazuh/network/deploy-network.sh). El access_log de nginx.conf (stdout) sigue igual.
#
# IP del cliente: $remote_addr ya es la IP real porque edge.conf confía en X-Forwarded-For solo desde la
# VPC del ALB (set_real_ip_from + real_ip_recursive). Se guarda también la cadena XFF completa.
# Privacidad: no se registran cuerpos, cookies ni cabeceras de autorización; en el callback OIDC y el SSO
# de B89 Respond se registra la ruta sin query (código de autorización y state).

# Health checks del ALB: no se registran (≈6.000 líneas/día sin valor de detección).
map $http_user_agent $b89_edge_loggable {
  "~^ELB-HealthChecker" 0;
  default 1;
}

map $uri $b89_edge_log_url {
  "~^/api/auth/callback" $uri;
  "~^/b89-respond/sso" $uri;
  default $request_uri;
}

# Resultado del login con contraseña: el API responde 303 en ambos casos; el fallo lleva authError= en
# Location (apps/api/src/soc/auth.controller.ts, withAuthError).
map "$request_method $uri $sent_http_location" $b89_edge_auth_result {
  "~^POST /api/auth/password .*authError=" failure;
  "~^POST /api/auth/password ." success;
  default "";
}

log_format b89_edge_json escape=json
  '{"b89":{"vendor":"b89-edge","source":"nginx_access"},'
  '"timestamp":"$time_iso8601","srcip":"$remote_addr","xff":"$http_x_forwarded_for",'
  '"host":"$host","method":"$request_method","url":"$b89_edge_log_url","protocol":"$server_protocol",'
  '"http_status":"$status","bytes":"$body_bytes_sent","request_time":"$request_time",'
  '"upstream_status":"$upstream_status","user_agent":"$http_user_agent","referer":"$http_referer",'
  '"tls":"$ssl_protocol","auth_result":"$b89_edge_auth_result"}';

access_log /var/log/b89-edge/access.json b89_edge_json if=$b89_edge_loggable;
error_log /var/log/b89-edge/error.log warn;
