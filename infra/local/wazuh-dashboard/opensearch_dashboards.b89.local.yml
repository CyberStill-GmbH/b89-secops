# opensearch_dashboards.yml del dashboard LOCAL detrás del edge B89 (infra/local/edge).
# = wazuh/dashboard/opensearch_dashboards.b89.yml + conexión al indexer de wazuh-docker single-node.
# Requiere la imagen con los plugins b89_ops y b89_i18n (las claves b89_* hacen fallar el
# arranque sin ellos) y el dominio de proxy auth en el indexer (infra/local/edge/apply-indexer-security.sh).

# Solo lo alcanza el edge nginx por la red Docker (sin puerto publicado en el host).
server.host: 0.0.0.0
server.port: 5601
server.ssl.enabled: false

# --- Indexer de wazuh-docker (TLS con su CA) ---
opensearch.hosts: https://wazuh.indexer:9200
opensearch.ssl.verificationMode: certificate
opensearch.ssl.certificateAuthorities: ['/usr/share/wazuh-dashboard/certs/root-ca.pem']
opensearch_security.readonly_mode.roles: ['kibana_read_only']
opensearch_security.cookie.secure: true
opensearch_security.cookie.ttl: 900000
opensearch_security.session.ttl: 900000
opensearch_security.session.keepalive: true

# --- Identidad: la sesión B89 por proxy auth ---
opensearch_security.auth.type: 'proxy'
opensearch_security.proxycache.user_header: 'x-proxy-user'
opensearch_security.proxycache.roles_header: 'x-proxy-roles'
opensearch_security.auth.logout_url: '/b89/logout'
opensearch_security.multitenancy.enabled: false
opensearch.requestHeadersAllowlist:
  ['securitytenant', 'Authorization', 'x-forwarded-for', 'x-proxy-user', 'x-proxy-roles']

# --- Plugin b89_ops: login B89 (la API B89 corre en el host, detrás del edge) ---
b89_ops.enabled: true
b89_ops.apiPrefix: '/api'
b89_ops.login.enabled: true
b89_ops.login.defaultNextUrl: '/app/b89-alerts'
b89_ops.bunny.enabled: true
b89_ops.login.passwordEnabled: true
b89_ops.login.destinationLabel: 'B89'

# --- Marca B89 ---
opensearchDashboards.branding:
  applicationTitle: 'B89 SecOps'
  useExpandedHeader: false

uiSettings:
  overrides:
    'theme:version': 'v7'
    'theme:darkMode': true
    defaultRoute: '/app/b89-alerts'
    'state:storeInSessionStorage': true
