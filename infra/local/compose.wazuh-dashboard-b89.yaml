# Override LOCAL de wazuh-docker single-node: stack en la versión del overlay (Wazuh 4.14.8 /
# OSD 2.19.6, wazuh/dashboard/upstream.lock) y dashboard con la marca B89.
#
# Las rutas relativas de un override se resuelven contra el directorio del PRIMER compose
# (…/wazuh-docker/single-node), por eso se usa B89_REPO (por defecto, b89-secops junto al repo
# que contiene .local/wazuh-docker). Uso, desde single-node:
#
#   $env:B89_REPO = 'C:/Users/<yo>/Documents/GitHub/b89-secops'
#   docker compose -f docker-compose.yml -f <override de memoria> `
#     -f $env:B89_REPO/infra/local/compose.wazuh-dashboard-b89.yaml up -d --build
#
# Plugins B89: compilarlos antes con `bash infra/local/wazuh-dashboard/build-plugins.sh`
# (deja los zip en infra/local/wazuh-dashboard/plugins-dist/, que el Dockerfile instala).
services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.8

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.8
    # Solo desde este equipo: el indexer confía en x-proxy-user/x-proxy-roles del dashboard.
    ports: !override
      - '127.0.0.1:9200:9200'

  wazuh.dashboard:
    image: b89/wazuh-dashboard-local:4.14.8
    build:
      context: ${B89_REPO:-../../../../b89-secops}/infra/local/wazuh-dashboard
      additional_contexts:
        brand: ${B89_REPO:-../../../../b89-secops}/wazuh/dashboard
      args:
        WAZUH_VERSION: 4.14.8
    # Sin puerto en el host: la única entrada es el edge (https://localhost).
    ports: !reset []
    # IP fija: es el ÚNICO origen al que el indexer acepta proxy auth (xff.internalProxies,
    # infra/local/edge/apply-indexer-security.sh). Cambiarla obliga a reaplicar ese script.
    networks:
      default:
        ipv4_address: 172.30.89.10
    volumes:
      - ${B89_REPO:-../../../../b89-secops}/infra/local/wazuh-dashboard/opensearch_dashboards.b89.local.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs -o /dev/null http://localhost:5601/b89/login || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # Edge B89 (copia local de wazuh/edge/b89-edge.conf). La API B89 corre en el host (puerto 3089, edge/api.local.env).
  b89-edge:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - '443:443'
    volumes:
      - ${B89_REPO:-../../../../b89-secops}/infra/local/edge/b89-edge.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ${B89_REPO:-../../../../b89-secops}/infra/local/edge/certs:/etc/nginx/certs:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - wazuh.dashboard
    networks:
      default:
        ipv4_address: 172.30.89.20

# Subred fija para poder fijar la IP del dashboard (cambiarla exige `docker compose down`).
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.89.0/24
