# Edge B89 LOCAL: copia de wazuh/edge/b89-edge.conf adaptada a Docker Desktop.
#   navegador ──TLS (https://localhost)──▶ nginx (contenedor b89-edge)
#                                            ├─▶ OSD fork B89  http://wazuh.dashboard:5601
#                                            └─▶ API B89       http://host.docker.internal:3000 (pnpm dev / node en el host)
# Diferencias con producción: certificado autofirmado de localhost (certs/), sin bloque :80/ACME,
# sin ruta opcional de b89-respond, upstreams por nombre de servicio Docker.
# Mantener sincronizado con wazuh/edge/b89-edge.conf (rutas, allowlist y cabeceras).

proxy_cache_path /var/cache/nginx/b89_auth levels=1 keys_zone=b89_auth:10m max_size=50m inactive=60s;

upstream b89_api {
  server host.docker.internal:3000;
  keepalive 16;
}

upstream b89_osd {
  server wazuh.dashboard:5601;
  keepalive 16;
}

map $http_accept $b89_wants_html {
  default 0;
  "~*text/html" 1;
}

server {
  listen 443 ssl;
  http2 on;
  server_name localhost;
  ssl_certificate     /etc/nginx/certs/localhost.crt;
  ssl_certificate_key /etc/nginx/certs/localhost.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 50m;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  location ~ ^/api/(auth|alerts|incidents|changes|sources|operations|audit|admin|me)(/|$) {
    proxy_pass http://b89_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header x-proxy-user "";
    proxy_set_header x-proxy-roles "";
    proxy_buffering off;
    proxy_read_timeout 65s;
  }

  location ~ "^/api/notifications(/[0-9a-fA-F-]{36}/acknowledge)?$" {
    proxy_pass http://b89_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header x-proxy-user "";
    proxy_set_header x-proxy-roles "";
  }

  location = /_b89/introspect {
    internal;
    proxy_pass http://b89_api/api/auth/introspect;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Accept "application/json";
    proxy_set_header Origin https://$host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header x-proxy-user "";
    proxy_set_header x-proxy-roles "";
    proxy_cache          b89_auth;
    proxy_cache_key      $cookie_b89_session;
    proxy_cache_valid    204 5s;
    proxy_cache_valid    401 403 0;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
  }

  location ^~ /b89/ {
    proxy_pass http://b89_osd;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header x-proxy-user "";
    proxy_set_header x-proxy-roles "";
  }

  location ^~ /ui/ {
    proxy_pass http://b89_osd;
    proxy_set_header Host $host;
    proxy_set_header x-proxy-user "";
    proxy_set_header x-proxy-roles "";
  }

  location = /app/login {
    return 302 /b89/login$is_args$args;
  }

  location / {
    auth_request /_b89/introspect;
    auth_request_set $b89_user  $upstream_http_x_b89_user;
    auth_request_set $b89_roles $upstream_http_x_b89_roles;
    error_page 401 = @b89_sign_in;
    error_page 403 = @b89_forbidden;

    proxy_pass http://b89_osd;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header x-proxy-user  $b89_user;
    proxy_set_header x-proxy-roles $b89_roles;
    proxy_read_timeout 120s;
  }

  location @b89_sign_in {
    if ($b89_wants_html) {
      return 302 /b89/login?nextUrl=$request_uri;
    }
    default_type application/json;
    return 401 '{"code":"AUTH_REQUIRED"}';
  }

  location @b89_forbidden {
    if ($b89_wants_html) {
      return 302 /b89/login?authError=NETWORK_NOT_ALLOWED;
    }
    default_type application/json;
    return 403 '{"code":"NETWORK_NOT_ALLOWED"}';
  }
}
