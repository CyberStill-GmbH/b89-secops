# Override del single-node oficial de wazuh-docker (v4.14.8) para el nodo B89 SOC en AWS.
# Se aplica desde /opt/b89/wazuh-docker/single-node con:
#   docker compose --env-file /opt/b89/secrets/compose.env -f docker-compose.yml \
#     -f /opt/b89/src/infra/aws-poweruser/host/compose.b89.yaml up -d
# Los valores ${...} salen de /opt/b89/secrets/compose.env (0600, generado en el host).
name: b89

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.89.0/24
  correlator-internal:
    name: b89-correlator-internal
    internal: true

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.8
    # Wazuh push uses the public certificate name but resolves it to this private edge address.
    # The signed ingestion endpoint therefore traverses the same TLS gateway as other API calls.
    extra_hosts:
      - '${SOC_HOSTNAME}:172.30.89.11'
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_ADMIN_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    ports: !override
      - '1514:1514'
      - '1515:1515'
      - '127.0.0.1:55000:55000'
    restart: unless-stopped

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.8
    environment:
      - 'OPENSEARCH_JAVA_OPTS=-Xms3g -Xmx3g'
    ports: !override
      - '127.0.0.1:9200:9200'
    restart: unless-stopped

  wazuh.dashboard:
    image: b89/wazuh-dashboard:4.14.8
    build:
      context: /opt/b89/src/infra/local/wazuh-dashboard
      additional_contexts:
        brand: /opt/b89/src/wazuh/dashboard
      args:
        WAZUH_VERSION: 4.14.8
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_ADMIN_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${KIBANASERVER_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    ports: !reset []
    # IP fija: es el ÚNICO proxy en el que confía el indexer para x-proxy-user (xff.internalProxies).
    networks:
      default:
        ipv4_address: 172.30.89.10
    volumes:
      - /opt/b89/config/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: b89_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: b89_secops
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/b89-pki/postgres.crt
      - -c
      - ssl_key_file=/etc/b89-pki/postgres.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
    volumes:
      - b89-postgres:/var/lib/postgresql
      - /opt/b89/pki/postgres:/etc/b89-pki:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U b89_admin -d b89_secops']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrator:
    image: b89/migrator:local
    build:
      context: /opt/b89/src
      dockerfile: platform/database/Dockerfile.migrator
    profiles: ['tools']
    environment:
      B89_POSTGRES_HOST: postgres
      B89_POSTGRES_PORT: '5432'
      B89_POSTGRES_DATABASE: b89_secops
      B89_POSTGRES_TLS: 'true'
      B89_MIGRATOR_PASSWORD: ${B89_MIGRATOR_PASSWORD}
      NODE_EXTRA_CA_CERTS: /etc/b89-local/ca.pem
    volumes:
      - /opt/b89/pki/ca.pem:/etc/b89-local/ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: b89/api:local
    build:
      context: /opt/b89/src
      dockerfile: apps/api/Dockerfile
    env_file:
      - /opt/b89/config/api.env
      - /opt/b89/secrets/api.env
    environment:
      NODE_EXTRA_CA_CERTS: /etc/b89-local/ca.pem
    volumes:
      - /opt/b89/pki/ca.pem:/etc/b89-local/ca.pem:ro
    networks:
      - default
      - correlator-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Gateway C-28 mínimo con token estático (platform/gateway/static-token): única vía del API al
  # indexer. Sin puerto publicado; inyecta la credencial read-only de b89_reader.
  wazuh-gateway:
    image: nginx:1.29.3
    env_file:
      - /opt/b89/secrets/gateway.env
    environment:
      WAZUH_INDEXER_UPSTREAM: wazuh.indexer:9200
      WAZUH_INDEXER_TLS_NAME: wazuh.indexer
      NGINX_ENVSUBST_FILTER: '^(B89_WAZUH_GATEWAY_ACCESS_TOKEN|WAZUH_INDEXER_BASIC_AUTH_B64|WAZUH_INDEXER_UPSTREAM|WAZUH_INDEXER_TLS_NAME)$'
    volumes:
      - /opt/b89/src/platform/gateway/static-token/wazuh-gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /opt/b89/pki/gateway/cert.pem:/etc/b89-gateway/tls/cert.pem:ro
      - /opt/b89/pki/gateway/key.pem:/etc/b89-gateway/tls/key.pem:ro
      - /opt/b89/pki/gateway/indexer-ca.pem:/etc/b89-gateway/indexer-ca.pem:ro
    networks:
      - default
      - correlator-internal
    depends_on:
      - wazuh.indexer
    restart: unless-stopped

  # Correlación determinista 24/7. Solo se conecta al API y al gateway en la red
  # interna, no publica puertos y arranca en modo observación (EMIT=false).
  correlator:
    image: b89/correlator:local
    build:
      context: /opt/b89/src
      dockerfile: services/b89-correlator/Dockerfile
    env_file:
      - /opt/b89/config/correlator.env
    environment:
      B89_CORRELATOR_LISTEN: ':8080'
      B89_CORRELATOR_API_URL: http://api:3000/api
      B89_CORRELATOR_GATEWAY_URL: https://wazuh-gateway:8443
      B89_CORRELATOR_GATEWAY_TOKEN_FILE: /run/secrets/b89-correlator/gateway.token
      B89_CORRELATOR_SERVICE_TOKEN_FILE: /run/secrets/b89-correlator/service.token
      B89_CORRELATOR_READ_TOKEN_FILE: /run/secrets/b89-correlator/read.token
      B89_CORRELATOR_CA_FILE: /run/secrets/b89-correlator/ca.pem
      # Criticidad versionada (demoter, no cegar) e IP de administración de detections/lists.
      B89_CORRELATOR_CRITICALITY_FILE: /etc/b89-correlator/criticality
      B89_CORRELATOR_ADMIN_IPS_FILE: /etc/b89-correlator/b89-admin-ips
    volumes:
      - /opt/b89/secrets/correlator/gateway.token:/run/secrets/b89-correlator/gateway.token:ro
      - /opt/b89/secrets/correlator/service.token:/run/secrets/b89-correlator/service.token:ro
      - /opt/b89/secrets/correlator/read.token:/run/secrets/b89-correlator/read.token:ro
      - /opt/b89/pki/ca.pem:/run/secrets/b89-correlator/ca.pem:ro
      - /opt/b89/src/services/b89-correlator/config/criticality:/etc/b89-correlator/criticality:ro
      - /opt/b89/src/detections/lists/b89-admin-ips:/etc/b89-correlator/b89-admin-ips:ro
    networks:
      - correlator-internal
    depends_on:
      api:
        condition: service_healthy
      wazuh-gateway:
        condition: service_started
    user: '65532:65532'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    init: true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    restart: unless-stopped

  # Receptor del webhook SNS (monitoreo de la cuenta AWS sin IAM; wazuh/aws-events/README.md).
  # Sin puerto publicado: solo el edge le llega por /hooks/aws-sns. Escribe el JSONL dentro del
  # volumen de logs del manager (b89-collectors/aws), que Wazuh lee como <localfile log_format="json">.
  aws-events:
    image: node:24.21.0-trixie-slim
    user: '1000:1000'
    working_dir: /app
    command: ['node', '/app/sns-receiver.mjs']
    env_file:
      - /opt/b89/src/infra/aws-poweruser/host/aws-events.env
    environment:
      B89_AWS_EVENTS_FILE: /out/aws-events.jsonl
      NODE_ENV: production
    volumes:
      - /opt/b89/src/wazuh/aws-events/receiver/sns-receiver.mjs:/app/sns-receiver.mjs:ro
      - type: volume
        source: wazuh_logs
        target: /out
        volume:
          subpath: b89-collectors/aws
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    restart: unless-stopped

  edge:
    image: nginx:1.29.3
    # IP fija: único proxy de confianza del API (B89_ACCESS_TRUSTED_PROXY_CIDRS).
    networks:
      default:
        ipv4_address: 172.30.89.11
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /opt/b89/config/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      # Bitácora JSON del edge para Wazuh (docs/18): formato en b89-logging.conf y archivos en el
      # volumen de logs del manager (b89-collectors/edge), que Wazuh lee como <localfile> json.
      - /opt/b89/src/infra/wazuh/network/edge/b89-edge-logging.conf:/etc/nginx/conf.d/b89-logging.conf:ro
      - type: volume
        source: wazuh_logs
        target: /var/log/b89-edge
        volume:
          subpath: b89-collectors/edge
    depends_on:
      - wazuh.dashboard
      - api
    restart: unless-stopped

volumes:
  b89-postgres:
