# Override del single-node oficial de wazuh-docker (v4.14.8) para el nodo B89 SOC en AWS.
# Se aplica desde /opt/b89/wazuh-docker/single-node con:
#   docker compose --env-file /opt/b89/secrets/compose.env -f docker-compose.yml \
#     -f /opt/b89/src/infra/aws-poweruser/host/compose.b89.yaml up -d
# Los valores ${...} salen de /opt/b89/secrets/compose.env (0600, generado en el host).
name: b89

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.89.0/24

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.8
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_ADMIN_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    ports: !override
      - '1514:1514'
      - '1515:1515'
      - '127.0.0.1:55000:55000'
    restart: unless-stopped

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.8
    environment:
      - 'OPENSEARCH_JAVA_OPTS=-Xms3g -Xmx3g'
    ports: !override
      - '127.0.0.1:9200:9200'
    restart: unless-stopped

  wazuh.dashboard:
    image: b89/wazuh-dashboard:4.14.8
    build:
      context: /opt/b89/src/infra/local/wazuh-dashboard
      additional_contexts:
        brand: /opt/b89/src/wazuh/dashboard
      args:
        WAZUH_VERSION: 4.14.8
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_ADMIN_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${KIBANASERVER_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    ports: !reset []
    # IP fija: es el ÚNICO proxy en el que confía el indexer para x-proxy-user (xff.internalProxies).
    networks:
      default:
        ipv4_address: 172.30.89.10
    volumes:
      - /opt/b89/config/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: b89_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: b89_secops
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/b89-pki/postgres.crt
      - -c
      - ssl_key_file=/etc/b89-pki/postgres.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
    volumes:
      - b89-postgres:/var/lib/postgresql
      - /opt/b89/pki/postgres:/etc/b89-pki:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U b89_admin -d b89_secops']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrator:
    image: b89/migrator:local
    build:
      context: /opt/b89/src
      dockerfile: platform/database/Dockerfile.migrator
    profiles: ['tools']
    environment:
      B89_POSTGRES_HOST: postgres
      B89_POSTGRES_PORT: '5432'
      B89_POSTGRES_DATABASE: b89_secops
      B89_POSTGRES_TLS: 'true'
      B89_MIGRATOR_PASSWORD: ${B89_MIGRATOR_PASSWORD}
      NODE_EXTRA_CA_CERTS: /etc/b89-local/ca.pem
    volumes:
      - /opt/b89/pki/ca.pem:/etc/b89-local/ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: b89/api:local
    build:
      context: /opt/b89/src
      dockerfile: apps/api/Dockerfile
    env_file:
      - /opt/b89/config/api.env
      - /opt/b89/secrets/api.env
    environment:
      NODE_EXTRA_CA_CERTS: /etc/b89-local/ca.pem
    volumes:
      - /opt/b89/pki/ca.pem:/etc/b89-local/ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Gateway C-28 mínimo con token estático (platform/gateway/static-token): única vía del API al
  # indexer. Sin puerto publicado; inyecta la credencial read-only de b89_reader.
  wazuh-gateway:
    image: nginx:1.29.3
    env_file:
      - /opt/b89/secrets/gateway.env
    environment:
      WAZUH_INDEXER_UPSTREAM: wazuh.indexer:9200
      WAZUH_INDEXER_TLS_NAME: wazuh.indexer
      NGINX_ENVSUBST_FILTER: '^(B89_WAZUH_GATEWAY_ACCESS_TOKEN|WAZUH_INDEXER_BASIC_AUTH_B64|WAZUH_INDEXER_UPSTREAM|WAZUH_INDEXER_TLS_NAME)$'
    volumes:
      - /opt/b89/src/platform/gateway/static-token/wazuh-gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /opt/b89/pki/gateway/cert.pem:/etc/b89-gateway/tls/cert.pem:ro
      - /opt/b89/pki/gateway/key.pem:/etc/b89-gateway/tls/key.pem:ro
      - /opt/b89/pki/gateway/indexer-ca.pem:/etc/b89-gateway/indexer-ca.pem:ro
    depends_on:
      - wazuh.indexer
    restart: unless-stopped

  edge:
    image: nginx:1.29.3
    # IP fija: único proxy de confianza del API (B89_ACCESS_TRUSTED_PROXY_CIDRS).
    networks:
      default:
        ipv4_address: 172.30.89.11
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /opt/b89/config/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - wazuh.dashboard
      - api
    restart: unless-stopped

volumes:
  b89-postgres:
