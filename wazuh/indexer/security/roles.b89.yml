# Fragmento para opensearch-security/roles.yml. Mínimo privilegio por rol B89.
# Ninguno de estos roles escribe en índices de Wazuh ni gestiona la seguridad.
# Las vistas de la app de Wazuh leen además wazuh-monitoring-* (estado de agentes),
# wazuh-statistics-* (Estadísticas del servidor) y wazuh-states-* (vulnerabilidades, IT Hygiene,
# FIM): sin `read` sobre ellos los paneles fallan con security_exception aunque el index pattern
# exista (lo precrea como admin infra/aws-poweruser/scripts/bootstrap-wazuh-app.sh).
# indices:admin/get (solo metadatos): la app comprueba con HEAD <índice> si hay datos de muestra
# (/indexer/sampledata/*); sin él responde 403 y registra «Error checking sample data indices».
_meta:
  type: 'roles'
  config_version: 2

b89_soc_analyst:
  cluster_permissions:
    [
      'cluster_composite_ops_ro',
      'cluster:admin/opendistro/ad/detector/info',
      'cluster:admin/opendistro/ad/detectors/get',
      'cluster:admin/opendistro/ad/detector/search',
    ]
  index_permissions:
    - index_patterns:
        [
          'wazuh-alerts-*',
          'restored-wazuh-alerts-*',
          'wazuh-monitoring-*',
          'wazuh-statistics-*',
          'wazuh-states-*',
          'b89-cloudflare-traffic-*',
          '.opendistro-anomaly-results*',
        ]
      allowed_actions: ['read', 'indices:admin/mappings/get', 'indices:admin/get']
  tenant_permissions:
    - tenant_patterns: ['global_tenant']
      allowed_actions: ['kibana_all_read']

b89_soc_lead:
  cluster_permissions:
    [
      'cluster_composite_ops_ro',
      'cluster:admin/opendistro/ad/detector/info',
      'cluster:admin/opendistro/ad/detectors/get',
      'cluster:admin/opendistro/ad/detector/search',
    ]
  index_permissions:
    - index_patterns:
        [
          'wazuh-alerts-*',
          'wazuh-archives-*',
          'restored-*',
          'wazuh-monitoring-*',
          'wazuh-statistics-*',
          'wazuh-states-*',
          'b89-cloudflare-traffic-*',
          '.opendistro-anomaly-results*',
        ]
      allowed_actions: ['read', 'indices:admin/mappings/get', 'indices:admin/get']
  tenant_permissions:
    - tenant_patterns: ['global_tenant']
      allowed_actions: ['kibana_all_write']

b89_auditor:
  cluster_permissions: ['cluster_composite_ops_ro']
  index_permissions:
    - index_patterns:
        [
          'wazuh-alerts-*',
          'restored-*',
          'wazuh-monitoring-*',
          'wazuh-statistics-*',
          'wazuh-states-*',
          'b89-cloudflare-traffic-*',
        ]
      allowed_actions: ['read', 'indices:admin/mappings/get', 'indices:admin/get']
  tenant_permissions:
    - tenant_patterns: ['global_tenant']
      allowed_actions: ['kibana_all_read']

# Lector de la API B89 (reconciliación más resultados de ML). Lo crea wazuh/access/apply-access.sh.
b89_reader_role:
  cluster_permissions:
    [
      'cluster_composite_ops_ro',
      'cluster:admin/opendistro/ad/detector/info',
      'cluster:admin/opendistro/ad/detectors/get',
      'cluster:admin/opendistro/ad/detector/search',
    ]
  index_permissions:
    - index_patterns: ['wazuh-alerts-*', '.opendistro-anomaly-results*']
      allowed_actions: ['read']

# Escritor del índice de tráfico de Cloudflare (traffic_index.py). Solo ese patrón; sin lectura de
# otros índices. Usuario interno b89_traffic_writer (lo crea setup-traffic-index.sh).
b89_cloudflare_traffic_writer:
  cluster_permissions: ['indices:data/write/bulk']
  index_permissions:
    - index_patterns: ['b89-cloudflare-traffic-*']
      allowed_actions: ['crud', 'create_index', 'indices:admin/mapping/put']
