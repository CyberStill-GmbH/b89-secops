# Fragmento para opensearch-security/roles_mapping.yml.
# backend_roles = valores de x-proxy-roles, que son los app roles de Entra resueltos por B89.
# Dar o quitar el rol en Entra (o en B89, ver docs/04) cambia el acceso al dashboard sin tocarlo.
_meta:
  type: 'rolesmapping'
  config_version: 2

all_access:
  reserved: false
  backend_roles: ['b89.platform.admin']
  users: ['admin'] # break-glass, solo por SSM port-forward

b89_soc_lead:
  backend_roles: ['b89.soc.lead']

b89_soc_analyst:
  backend_roles: ['b89.soc.analyst']

b89_auditor:
  backend_roles: ['b89.auditor']

# Todo usuario autenticado necesita leer la configuración del dashboard.
kibana_user:
  backend_roles: ['b89.soc.analyst', 'b89.soc.lead', 'b89.auditor', 'b89.platform.admin']

b89_reader_role:
  users: ['b89_reader']
