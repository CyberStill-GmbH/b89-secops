<!-- B89 SOC · política de agente OPT-IN: windows-telemetry-extended (docs/16-politicas.md).
     Administrado por wazuh/manager/policy/apply-agent-groups.sh; el grupo se crea VACÍO.
     GATE: Sysmon Event ID 1 y PowerShell 4104 pueden contener líneas de comando y contenido de
     scripts (datos personales/secretos). Asignar un agente a este grupo requiere aprobación de
     privacidad/retención (Ley 29733, N2) y una configuración Sysmon revisada
     (infra/wazuh/active-directory/README.md, infra/wazuh/endpoint/README.md).
     Se asigna como grupo adicional: windows-servers,windows-telemetry-extended. -->
<agent_config os="Windows">

  <labels>
    <label key="b89.telemetry">extended</label>
  </labels>

  <!-- Sysmon (solo si está instalado): proceso (1), red (3), driver (6), acceso a LSASS y otros
       (10), creación de archivo ejecutable (11/29), registro (12/13), DNS (22), manipulación (25). -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID = 1 or EventID = 3 or EventID = 6 or EventID = 10 or EventID = 11 or EventID = 12 or EventID = 13 or EventID = 22 or EventID = 25 or EventID = 29]</query>
  </localfile>

  <!-- PowerShell: Script Block Logging (4104) y carga de motor (400). -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID = 4104]</query>
  </localfile>
  <localfile>
    <location>Windows PowerShell</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID = 400]</query>
  </localfile>

</agent_config>
